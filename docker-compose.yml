services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    # Bound to localhost only — the host-level Caddy (in /etc/caddy/Caddyfile) terminates
    # TLS and reverse-proxies rin.andresmorales.com.co to 127.0.0.1:3000. Avoids port
    # conflict with mailcow nginx which already holds host :80/:443 via this host.
    ports:
      - "127.0.0.1:3000:3000"